<!DOCTYPE html>
<html>

<head>
  <title>Baroque Me Baby</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Baroque Me Baby - Generative baroque-style geometric art">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="fav.svg">
  <link rel="shortcut icon" href="fav.svg" type="image/svg+xml">
  <style>
    /* --- PERFECT RESET --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      position: fixed;
      width: 100%;
      height: 100%;
      height: 100dvh;
    }
    
    /* --- MAIN CONTAINER --- */
    #main-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      height: 100dvh;
      padding: 20px;
      gap: 8px;
    }
    
    /* --- TITLE (CENTER TOP) --- */
    .title-bar {
      text-align: center;
      flex-shrink: 0;
      padding: 2px 0;
      width: 100%;
    }
    .title-bar .title {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 8px;
      color: rgba(255,255,255,0.85);
      text-transform: uppercase;
    }
    .title-bar .title .accent {
      color: #c9a84c;
      font-weight: 400;
    }
    
    /* --- CANVAS CONTAINER --- */
    #canvas-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 0;
      padding: 0 10px;
      position: relative;
    }
    
    canvas {
      display: block;
      box-shadow: 0 0 80px rgba(0,0,0,0.9);
      image-rendering: auto;
      touch-action: none;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 2px;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    
    /* --- SHIRT MOCKUP --- */
    #shirt-mockup {
      display: none;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 0 80px rgba(0,0,0,0.9);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    #shirt-mockup.active {
      display: block;
      animation: fadeIn 0.6s ease;
    }
    
    canvas.hidden {
      display: none;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    
    /* --- BOTTOM BAR --- */
    .bottom-bar {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 6px;
      padding: 4px 0;
    }
    
    /* --- CONTROLS --- */
    .controls-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    
    .controls {
      color: rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.04);
      padding: 8px 20px;
      border-radius: 30px;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Roboto, Arial, sans-serif;
      font-size: 11px;
      font-weight: 400;
      border: 1px solid rgba(255,255,255,0.08);
      text-align: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: all 0.3s ease;
      letter-spacing: 0.8px;
      touch-action: manipulation;
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .controls:hover {
      color: rgba(255,255,255,0.95);
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
    }
    .controls:active {
      transform: scale(0.95);
    }
    .controls .key {
      color: rgba(255,255,255,0.5);
      font-weight: 300;
    }
    .controls .sep {
      color: rgba(255,255,255,0.15);
      margin: 0 4px;
    }
    
    /* --- SHIRT BUTTON --- */
    .controls.shirt-btn {
      border-color: rgba(201, 168, 76, 0.2);
      color: rgba(201, 168, 76, 0.7);
      letter-spacing: 1px;
    }
    .controls.shirt-btn:hover {
      border-color: rgba(201, 168, 76, 0.4);
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.06);
    }
    .controls.shirt-btn.active {
      border-color: rgba(201, 168, 76, 0.5);
      color: #c9a84c;
      background: rgba(201, 168, 76, 0.08);
    }
    .controls.shirt-btn .icon {
      font-size: 14px;
      line-height: 1;
    }
    
    /* --- INFO ROW --- */
    .info-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      color: rgba(255,255,255,0.3);
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
      font-size: 9px;
      letter-spacing: 0.5px;
      flex-wrap: wrap;
      padding: 2px 0;
    }
    .info-row .info-item {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.04);
      background: rgba(255,255,255,0.02);
    }
    .info-row .label {
      color: rgba(255,255,255,0.25);
      font-weight: 300;
    }
    .info-row .value {
      color: rgba(255,255,255,0.5);
      font-weight: 400;
    }
    
    /* --- DESCRIPTION --- */
    .description {
      display: block;
      text-align: center;
      color: rgba(255,255,255,0.25);
      font-size: 8px;
      letter-spacing: 1.2px;
      line-height: 1.8;
      padding: 2px 10px;
      font-weight: 300;
      max-width: 500px;
      width: 100%;
      text-transform: uppercase;
    }
    .description .highlight {
      color: rgba(255,255,255,0.4);
    }
    .description .sep {
      color: rgba(255,255,255,0.08);
      margin: 0 4px;
    }
    
    /* ============================================
       RESPONSIVE
    ============================================ */
    
    @media (max-width: 1024px) {
      #main-container { padding: 16px; gap: 6px; }
      .title-bar .title { font-size: 20px; letter-spacing: 6px; }
      .controls { font-size: 10px; padding: 7px 16px; min-height: 34px; }
      .info-row { font-size: 8.5px; gap: 12px; }
      .info-row .info-item { padding: 2px 10px; }
      .description { font-size: 7.5px; letter-spacing: 1px; }
    }
    
    @media (max-width: 768px) {
      #main-container { padding: 12px; gap: 5px; }
      .title-bar .title { font-size: 17px; letter-spacing: 5px; }
      #canvas-container { padding: 0 6px; }
      .controls { font-size: 9px; padding: 6px 14px; min-height: 32px; letter-spacing: 0.6px; }
      .controls-row { gap: 6px; }
      .info-row { font-size: 8px; gap: 10px; }
      .info-row .info-item { padding: 2px 8px; }
      .description { font-size: 7px; letter-spacing: 0.8px; padding: 2px 6px; }
      .controls.shirt-btn .icon { font-size: 12px; }
    }
    
    @media (max-width: 480px) {
      #main-container { padding: 8px; gap: 4px; }
      .title-bar .title { font-size: 14px; letter-spacing: 4px; }
      #canvas-container { padding: 0 4px; }
      .controls { font-size: 8px; padding: 5px 12px; min-height: 28px; border-radius: 24px; letter-spacing: 0.4px; }
      .controls-row { gap: 4px; }
      .info-row { font-size: 7px; gap: 8px; }
      .info-row .info-item { padding: 2px 6px; gap: 4px; }
      .description { font-size: 6.5px; letter-spacing: 0.6px; padding: 2px 4px; line-height: 1.6; }
      .controls.shirt-btn .icon { font-size: 11px; }
    }
    
    @media (max-width: 380px) {
      #main-container { padding: 6px; gap: 3px; }
      .title-bar .title { font-size: 12px; letter-spacing: 3px; }
      #canvas-container { padding: 0 2px; }
      .controls { font-size: 7px; padding: 4px 10px; min-height: 26px; border-radius: 20px; }
      .info-row { font-size: 6.5px; gap: 6px; }
      .info-row .info-item { padding: 1px 5px; border-radius: 14px; }
      .description { font-size: 6px; letter-spacing: 0.5px; padding: 1px 3px; }
      .controls.shirt-btn .icon { font-size: 10px; }
    }
    
    @media (orientation: landscape) and (max-height: 500px) {
      #main-container { padding: 10px 20px; gap: 4px; flex-direction: row; flex-wrap: wrap; }
      .title-bar { width: 100%; flex-shrink: 0; }
      .title-bar .title { font-size: 16px; letter-spacing: 4px; }
      #canvas-container { flex: 1; min-height: 0; height: 100%; padding: 0 8px; }
      .bottom-bar { width: auto; max-width: 180px; flex-shrink: 0; gap: 4px; padding: 0 4px; }
      .controls { font-size: 8px; padding: 5px 12px; min-height: 28px; letter-spacing: 0.4px; }
      .controls-row { flex-direction: column; gap: 4px; }
      .info-row { font-size: 7px; gap: 6px; flex-direction: column; align-items: stretch; }
      .info-row .info-item { padding: 2px 8px; justify-content: center; }
      .description { font-size: 6px; max-width: 160px; padding: 1px 4px; line-height: 1.4; letter-spacing: 0.5px; }
    }
    
    @media (orientation: landscape) and (max-height: 380px) {
      #main-container { padding: 6px 12px; gap: 3px; }
      .title-bar .title { font-size: 13px; letter-spacing: 3px; }
      #canvas-container { padding: 0 4px; }
      .bottom-bar { max-width: 140px; gap: 3px; }
      .controls { font-size: 7px; padding: 4px 10px; min-height: 24px; border-radius: 16px; }
      .info-row { font-size: 6px; gap: 4px; }
      .info-row .info-item { padding: 1px 6px; }
      .description { font-size: 5.5px; max-width: 120px; padding: 1px 3px; }
    }
    
    @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
      canvas { image-rendering: auto; }
    }
    
    @supports (-webkit-touch-callout: none) {
      .controls { min-height: 40px; }
    }
    
    @media (prefers-reduced-motion: reduce) {
      .controls, canvas, #shirt-mockup { transition: none; }
      #shirt-mockup.active { animation: none; }
    }
  </style>
</head>

<body>

<!-- MAIN CONTAINER -->
<div id="main-container">

  <!-- TITLE (CENTER TOP) -->
  <div class="title-bar">
    <div class="title"><span class="accent">Baroque</span> Me Baby</div>
  </div>

  <!-- CANVAS CONTAINER -->
  <div id="canvas-container">
    <canvas id="target"></canvas>
    <img id="shirt-mockup" src="Baroque-Me-Baby.jpg" alt="Baroque Me Baby on T-Shirt" />
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">

    <!-- CONTROLS ROW -->
    <div class="controls-row">
      <div class="controls" id="controlsBar">
        <span class="key">●</span> regenerate <span class="sep">—</span> <span class="key">S</span> save
      </div>
      <div class="controls shirt-btn" id="shirtToggle">
        <span class="icon">◷</span> apparel
      </div>
    </div>

    <!-- INFO ROW -->
    <div class="info-row">
      <div class="info-item">
        <span class="label">seed</span>
        <span class="value" id="seedDisplay">---</span>
      </div>
      <div class="info-item">
        <span class="label">layers</span>
        <span class="value" id="layersDisplay">---</span>
      </div>
      <div class="info-item">
        <span class="label">decorations</span>
        <span class="value" id="decorationsDisplay">---</span>
      </div>
      <div class="info-item">
        <span class="label">style</span>
        <span class="value" id="styleDisplay">---</span>
      </div>
    </div>

    <!-- DESCRIPTION -->
    <div class="description">
      <span class="highlight">baroque generative art</span>
      <span class="sep">·</span>
      <span class="highlight">5–15 layers</span>
      <span class="sep">·</span>
      <span class="highlight">8–16 decorations</span>
      <span class="sep">·</span>
      <span class="highlight">4 art styles</span>
      <span class="sep">·</span>
      <span class="highlight">random color schemes</span>
      <span class="sep">·</span>
      <span class="highlight">seed-based</span>
    </div>

  </div>

</div>

<script>
// ============================================
// BAROQUE ME BABY — MINIMAL T-SHIRT EDITION
// ============================================

// --- DETERMINISTIC RANDOM GENERATOR ---
class RandomGenerator {
  constructor(seed) {
    this.seed = seed;
    this.state = seed;
  }
  rand() {
    let x = this.state;
    x ^= x << 13;
    x ^= x >> 17;
    x ^= x << 5;
    this.state = x;
    return (x >>> 0) / 4294967296;
  }
}

// --- STATE ---
let seed = Date.now() + Math.random() * 1000000;
let rng = new RandomGenerator(seed);
let features = {};
let showingShirt = false;

// --- CANVAS SETUP ---
const container = document.getElementById('canvas-container');
const canvas = document.getElementById('target');
const ctx = canvas.getContext('2d');
const shirtMockup = document.getElementById('shirt-mockup');

// --- SIZING ---
function sizeCanvas() {
  const containerRect = container.getBoundingClientRect();
  let maxWidth = containerRect.width;
  let maxHeight = containerRect.height;
  
  maxWidth = Math.max(maxWidth, 80);
  maxHeight = Math.max(maxHeight, 80);
  
  let size = Math.min(maxWidth, maxHeight);
  size = Math.max(size, 80);
  
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  
  canvas.width = Math.round(size * dpr);
  canvas.height = Math.round(size * dpr);
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  
  shirtMockup.style.width = size + 'px';
  shirtMockup.style.height = size + 'px';
  
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
  
  return size;
}

// --- DRAWING FUNCTIONS ---

function drawGothicFrame(ctx, x, y, size, rng) {
  ctx.save();
  ctx.translate(x, y);
  
  const frameColor1 = `rgb(${Math.floor(rng.rand() * 105 + 150)}, ${Math.floor(rng.rand() * 100 + 50)}, ${Math.floor(rng.rand() * 100 + 50)})`;
  const frameColor2 = `rgb(${Math.floor(rng.rand() * 100 + 50)}, ${Math.floor(rng.rand() * 105 + 150)}, ${Math.floor(rng.rand() * 100 + 50)})`;
  const frameColor3 = `rgb(${Math.floor(rng.rand() * 100 + 50)}, ${Math.floor(rng.rand() * 100 + 50)}, ${Math.floor(rng.rand() * 105 + 150)})`;
  
  const colorScheme = Math.floor(rng.rand() * 3);
  let mainColor, accentColor1, accentColor2;

  switch (colorScheme) {
    case 0:
      mainColor = frameColor1;
      accentColor1 = frameColor2;
      accentColor2 = frameColor3;
      break;
    case 1:
      mainColor = frameColor2;
      accentColor1 = frameColor3;
      accentColor2 = frameColor1;
      break;
    default:
      mainColor = frameColor3;
      accentColor1 = frameColor1;
      accentColor2 = frameColor2;
  }

  const frameWidth = Math.max(size * 0.08, Math.min(size * 0.15, 20));
  const innerSize = size - frameWidth * 2;
  const cornerRadius = size * 0.02;

  // Main frame
  ctx.fillStyle = mainColor;
  ctx.strokeStyle = '#000';
  ctx.lineWidth = Math.max(1, size * 0.002);
  roundRect(ctx, -size/2, -size/2, size, size, cornerRadius);
  ctx.fill();
  ctx.stroke();

  // Inner white area
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = 'transparent';
  roundRect(ctx, -innerSize/2, -innerSize/2, innerSize, innerSize, cornerRadius * 0.5);
  ctx.fill();

  // Decorations
  const decorationCount = Math.floor(rng.rand() * 8) + 8;
  const decorationSize = Math.max(frameWidth * 0.8, Math.min(frameWidth * 1.2, 15));

  for (let i = 0; i < decorationCount; i++) {
    const angle = 360 * i / decorationCount;
    const distance = size / 2 - frameWidth / 2;

    ctx.save();
    ctx.translate(Math.cos(angle * Math.PI / 180) * distance, Math.sin(angle * Math.PI / 180) * distance);
    ctx.rotate((angle + 90) * Math.PI / 180);

    if (i % 2 == 0) {
      ctx.fillStyle = rng.rand() > 0.3 ? accentColor1 : accentColor2;
      ctx.strokeStyle = '#000';
      ctx.lineWidth = Math.max(0.5, size * 0.001);
      ctx.beginPath();
      ctx.moveTo(0, -decorationSize / 2);
      ctx.lineTo(decorationSize / 3, 0);
      ctx.lineTo(0, decorationSize / 2);
      ctx.lineTo(-decorationSize / 3, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = rng.rand() > 0.3 ? accentColor2 : accentColor1;
      ctx.beginPath();
      ctx.moveTo(0, -decorationSize / 4);
      ctx.lineTo(decorationSize / 6, 0);
      ctx.lineTo(-decorationSize / 6, 0);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.fillStyle = rng.rand() > 0.3 ? accentColor2 : accentColor1;
      ctx.strokeStyle = '#000';
      ctx.lineWidth = Math.max(0.5, size * 0.001);
      ctx.beginPath();
      ctx.moveTo(-decorationSize / 2, 0);
      ctx.lineTo(0, -decorationSize);
      ctx.lineTo(decorationSize / 2, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = '#000';
      ctx.lineWidth = Math.max(0.3, size * 0.0005);
      ctx.beginPath();
      ctx.arc(0, 0, decorationSize, decorationSize * 2, -Math.PI, 0);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Corner decorations
  const cornerSize = Math.max(frameWidth * 1.2, Math.min(frameWidth * 1.5, 25));
  for (let i = 0; i < 4; i++) {
    ctx.save();
    ctx.rotate(90 * i * Math.PI / 180 + 45 * Math.PI / 180);
    ctx.translate(size / 2 - frameWidth / 2, 0);

    ctx.fillStyle = rng.rand() > 0.5 ? accentColor1 : accentColor2;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = Math.max(1, size * 0.002);
    ctx.beginPath();
    ctx.arc(0, 0, cornerSize / 2, 0, 2 * Math.PI);
    ctx.fill();
    ctx.stroke();

    const petals = Math.floor(rng.rand() * 6) + 6;
    for (let j = 0; j < petals; j++) {
      ctx.rotate(360 / petals * Math.PI / 180);
      ctx.fillStyle = rng.rand() > 0.5 ? accentColor2 : mainColor;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(cornerSize / 3, -cornerSize / 4);
      ctx.lineTo(cornerSize / 2, 0);
      ctx.lineTo(cornerSize / 3, cornerSize / 4);
      ctx.closePath();
      ctx.fill();
    }

    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(0, 0, cornerSize / 8, 0, 2 * Math.PI);
    ctx.fill();

    ctx.restore();
  }

  ctx.restore();
}

function drawArtwork(ctx, x, y, size, rng) {
  ctx.save();
  ctx.translate(x, y);

  ctx.strokeStyle = '#000';
  ctx.lineWidth = Math.max(1, size * 0.002);
  ctx.fillStyle = 'transparent';

  const layers = Math.floor(rng.rand() * 10) + 5;
  const rotation = rng.rand() * 360;
  const artworkType = rng.rand();

  let styleName = '';
  if (artworkType < 0.4) styleName = 'Concentric';
  else if (artworkType < 0.7) styleName = 'Radial';
  else if (artworkType < 0.85) styleName = 'Polygonal';
  else styleName = 'Organic';

  features.layers = layers;
  features.styleName = styleName;
  features.decorations = Math.floor(rng.rand() * 8) + 8;

  for (let i = 0; i < layers; i++) {
    const layerSize = size * (0.9 - i * (0.8 / (layers - 1)));

    ctx.save();
    ctx.rotate((rotation + (rng.rand() * 10 - 5) * (i % 2 ? -1 : 1)) * Math.PI / 180);

    ctx.strokeStyle = '#000';
    ctx.lineWidth = Math.max(0.5, size * 0.0015 * (1 - i / layers * 0.5));

    if (artworkType < 0.4) {
      // Concentric circles
      const detail = Math.floor(rng.rand() * 9) + 3;
      for (let j = 0; j < detail; j++) {
        const r = layerSize * (1 - j / detail);
        ctx.beginPath();
        ctx.arc(0, 0, r / 2, 0, 2 * Math.PI);
        ctx.stroke();
      }
    } else if (artworkType < 0.7) {
      // Radial lines
      const lines = Math.floor(rng.rand() * 30) + 6;
      for (let j = 0; j < lines; j++) {
        const angle = 360 * j / lines;
        const innerR = layerSize * (rng.rand() * 0.4 + 0.1);
        ctx.beginPath();
        ctx.moveTo(Math.cos(angle * Math.PI / 180) * innerR / 2, Math.sin(angle * Math.PI / 180) * innerR / 2);
        ctx.lineTo(Math.cos(angle * Math.PI / 180) * layerSize / 2, Math.sin(angle * Math.PI / 180) * layerSize / 2);
        ctx.stroke();
      }
    } else if (artworkType < 0.85) {
      // Polygonal
      const sides = Math.floor(rng.rand() * 6) + 3;
      ctx.beginPath();
      for (let j = 0; j < sides; j++) {
        const angle = 360 * j / sides;
        if (j === 0) ctx.moveTo(Math.cos(angle * Math.PI / 180) * layerSize / 2, Math.sin(angle * Math.PI / 180) * layerSize / 2);
        else ctx.lineTo(Math.cos(angle * Math.PI / 180) * layerSize / 2, Math.sin(angle * Math.PI / 180) * layerSize / 2);
      }
      ctx.closePath();
      ctx.stroke();
    } else {
      // Organic curves
      const points = Math.floor(rng.rand() * 10) + 5;
      ctx.beginPath();
      for (let j = 0; j <= points; j++) {
        const angle = 360 * j / points;
        const r = layerSize / 2 * (rng.rand() * 0.6 + 0.7);
        if (j === 0) ctx.moveTo(Math.cos(angle * Math.PI / 180) * r / 2, Math.sin(angle * Math.PI / 180) * r / 2);
        else ctx.lineTo(Math.cos(angle * Math.PI / 180) * r / 2, Math.sin(angle * Math.PI / 180) * r / 2);
      }
      ctx.closePath();
      ctx.stroke();
    }

    ctx.restore();

    // Additional decorative elements
    if (rng.rand() > 0.6) {
      const elements = Math.floor(rng.rand() * 9) + 3;
      for (let j = 0; j < elements; j++) {
        const angle = rng.rand() * 360;
        const dist = layerSize * (rng.rand() * 0.25 + 0.2);
        const eSize = layerSize * (rng.rand() * 0.07 + 0.03);

        ctx.save();
        ctx.translate(Math.cos(angle * Math.PI / 180) * dist / 2, Math.sin(angle * Math.PI / 180) * dist / 2);
        ctx.rotate(rng.rand() * 360 * Math.PI / 180);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = Math.max(0.5, size * 0.001);
        if (rng.rand() > 0.5) {
          ctx.beginPath();
          ctx.arc(0, 0, eSize / 2, 0, 2 * Math.PI);
          ctx.stroke();
        } else {
          ctx.strokeRect(-eSize/2, -eSize/2, eSize, eSize);
        }
        ctx.restore();
      }
    }
  }

  // Center dot
  ctx.strokeStyle = '#000';
  ctx.lineWidth = Math.max(1, size * 0.003);
  const centerSize = size * 0.1;
  ctx.beginPath();
  ctx.arc(0, 0, centerSize / 2, 0, 2 * Math.PI);
  ctx.stroke();

  ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// --- MAIN DRAW ---
function drawCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = canvas.width / dpr;
  const h = canvas.height / dpr;
  
  // White background
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, w, h);
  
  // Draw frame and artwork
  drawGothicFrame(ctx, w/2, h/2, w * 0.9, rng);
  drawArtwork(ctx, w/2, h/2, w * 0.8, rng);
}

// --- UPDATE UI ---
function updateUI() {
  document.getElementById('seedDisplay').textContent = String(seed).slice(0, 8);
  document.getElementById('layersDisplay').textContent = features.layers || '---';
  document.getElementById('decorationsDisplay').textContent = features.decorations || '---';
  document.getElementById('styleDisplay').textContent = features.styleName || '---';
}

// --- TOGGLE SHIRT ---
function toggleShirt() {
  showingShirt = !showingShirt;
  
  if (showingShirt) {
    canvas.classList.add('hidden');
    shirtMockup.classList.add('active');
    document.getElementById('shirtToggle').classList.add('active');
    document.getElementById('shirtToggle').innerHTML = '<span class="icon">◷</span> artwork';
  } else {
    canvas.classList.remove('hidden');
    shirtMockup.classList.remove('active');
    document.getElementById('shirtToggle').classList.remove('active');
    document.getElementById('shirtToggle').innerHTML = '<span class="icon">◷</span> apparel';
  }
}

// --- REGENERATE ---
function regenerate() {
  seed = Date.now() + Math.random() * 1000000;
  rng = new RandomGenerator(seed);
  features = {};
  
  sizeCanvas();
  drawCanvas();
  updateUI();
  
  if (showingShirt) {
    toggleShirt();
  }
}

// --- DOWNLOAD ---
function downloadArt() {
  const link = document.createElement('a');
  const seedStr = String(seed).slice(0, 8);
  link.download = 'BaroqueMeBaby_Seed' + seedStr + '.png';
  
  if (showingShirt) {
    link.href = shirtMockup.src;
  } else {
    link.href = canvas.toDataURL('image/png', 1.0);
  }
  link.click();
}

// --- RESIZE ---
let resizeTimer = null;
let isResizing = false;

function handleResize() {
  if (isResizing) return;
  isResizing = true;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function() {
    sizeCanvas();
    if (!showingShirt) {
      drawCanvas();
    }
    isResizing = false;
  }, 100);
}

// --- KEYBOARD ---
document.addEventListener('keydown', function(e) {
  if (e.key === 's' || e.key === 'S') {
    e.preventDefault();
    downloadArt();
  }
  if (e.key === 'r' || e.key === 'R') {
    e.preventDefault();
    regenerate();
  }
  if (e.key === 't' || e.key === 'T') {
    e.preventDefault();
    toggleShirt();
  }
});

// --- CONTROLS ---
document.getElementById('controlsBar').addEventListener('click', regenerate);
document.getElementById('controlsBar').addEventListener('touchend', function(e) {
  e.preventDefault();
  regenerate();
});

document.getElementById('shirtToggle').addEventListener('click', toggleShirt);
document.getElementById('shirtToggle').addEventListener('touchend', function(e) {
  e.preventDefault();
  toggleShirt();
});

// --- WINDOW ---
window.addEventListener('resize', handleResize);
window.addEventListener('orientationchange', function() {
  setTimeout(handleResize, 400);
});

// --- VISIBILITY ---
document.addEventListener('visibilitychange', function() {
  if (!document.hidden) {
    setTimeout(function() {
      if (!showingShirt) {
        drawCanvas();
      }
    }, 100);
  }
});

// --- INIT ---
function init() {
  sizeCanvas();
  drawCanvas();
  updateUI();
  
  console.log('Baroque Me Baby — Minimal T-Shirt Edition');
  console.log('◷ Press T to toggle apparel view');
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

window.regenerate = regenerate;
window.downloadArt = downloadArt;
window.toggleShirt = toggleShirt;

</script>
</body>
</html>
